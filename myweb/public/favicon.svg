<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff" />
      <stop offset="100%" stop-color="#faf5ff" />
    </linearGradient>
    <linearGradient id="srTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotating-ring {
        transform-origin: 32px 32px;
        animation: spin 3.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Fluid Organic Wavy Ring with Continuous Rotation -->
  <g class="rotating-ring">
    <path d="M 32,4 C 47,4 59,13 60,29 C 61,45 49,59 33,60 C 17,61 4,49 4,33 C 4,17 17,4 32,4 Z" 
          fill="none" 
          stroke="url(#orbitGrad)" 
          stroke-width="3.2" 
          filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Inner Soft Square Badge -->
  <rect x="12" y="12" width="40" height="40" rx="11" 
        fill="url(#boxGrad)" 
        stroke="#8b5cf6" 
        stroke-width="1.5" 
        stroke-opacity="0.35" />

  <!-- <SR/> Monogram -->
  <text x="32" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', 'JetBrains Mono', Consolas, monospace" 
        font-weight="900" 
        font-size="16.5" 
        letter-spacing="-1.2" 
        fill="url(#srTextGrad)" 
        text-anchor="middle">&lt;SR/&gt;</text>
</svg>
